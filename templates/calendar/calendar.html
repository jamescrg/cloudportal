{% include "calendar/header.html" %}
{% comment %}
A class, not an id: htmx copies an existing element's attributes onto a
swapped-in element with the same id until it settles, which would hand the
new container the old grid's classes and then strip the new grid's.
{% endcomment %}
<div class="fullcalendar-container"
     x-data="eventsCalendar()"
     x-init="initCalendar()"
     hx-disinherit="*"
     hx-boost="false"></div>
