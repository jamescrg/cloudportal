{% extends "base.html" %}
{% load cache_buster %}
{% block content %}
    <div class="row">
        <div class="col-lg-9 order-lg-2" id="main-content">
            <div id="notes"
                 {% if user.encryption_salt %}data-encryption-salt="{{ user.encryption_salt }}" data-encryption-iterations="{{ user.encryption_iterations }}" data-encryption-wrapped-key="{{ user.encryption_wrapped_key }}" data-encryption-by-default="{{ user.encryption_by_default|yesno:'true,false' }}"{% endif %}>
                {% include "notes/list.html" %}
            </div>
        </div>
        <div class="col-lg-3 order-lg-1" id="sidebar" data-drawer>{% include "folders/list.html" %}</div>
    </div>
    <script type="module">
    import { decrypt, unlock, paramsOf, hasFreshKey, refreshKeyTimestamp, storeKey, KEY_TTL_MS } from "{% static_v 'js/crypto.js' %}";

    function getCSRFToken() {
      const el = document.querySelector("[name=csrfmiddlewaretoken]");
      if (el) return el.value;
      // Fall back to htmx header on body
      const hxHeaders = document.body.getAttribute("hx-headers");
      if (hxHeaders) {
        try { return JSON.parse(hxHeaders)["X-CSRFToken"]; } catch (e) {}
      }
      return "";
    }

    async function fetchNoteContent(noteId) {
      const resp = await fetch("{% url 'settings-encryption-notes' %}", {
        headers: { "X-CSRFToken": getCSRFToken() },
      });
      const data = await resp.json();
      return data.notes.find(function(n) { return n.id === noteId; });
    }

    // Intercept clicks on encrypted note links to show unlock modal
    document.addEventListener("click", async function(e) {
      const link = e.target.closest('a[href]');
      if (!link) return;

      const row = link.closest('tr[data-encrypted="true"]');
      if (!row) return;

      const href = link.getAttribute('href');
      if (!href || href === '#') return;

      // Have a fresh key — let navigation proceed
      if (hasFreshKey(KEY_TTL_MS)) {
        refreshKeyTimestamp();
        return;
      }

      const salt = document.getElementById("notes")?.dataset.encryptionSalt;
      if (!salt) return; // Let editor handle no-salt case

      e.preventDefault();

      const noteId = parseInt(row.dataset.noteId, 10);
      const unlocked = await showUnlockDialog(noteId);
      if (unlocked) {
        window.location.href = href;
      }
    });

    // When every new note starts encrypted, the key is asked for before
    // one is made, so nothing is created if the passphrase isn't given
    // and the editor opens ready to type. Capture phase, ahead of htmx.
    document.addEventListener("click", async function(e) {
      const btn = e.target.closest("#add-note-btn");
      if (!btn || btn.dataset.unlocked === "true") return;
      const notes = document.getElementById("notes");
      if (!notes || notes.dataset.encryptionByDefault !== "true" || !notes.dataset.encryptionSalt) return;
      if (hasFreshKey(KEY_TTL_MS)) {
        refreshKeyTimestamp();
        return;
      }
      e.preventDefault();
      e.stopPropagation();
      if (await showUnlockDialog(null)) {
        btn.dataset.unlocked = "true";
        btn.click();
        delete btn.dataset.unlocked;
      }
    }, true);

    // The passphrase dialog; the key is kept once it opens the seal, or,
    // for a key from before the sealed scheme, once it decrypts the note
    async function showUnlockDialog(noteId) {
      return new Promise(function(resolve) {
        const overlay = document.createElement("div");
        overlay.className = "passphrase-dialog-overlay";
        overlay.innerHTML =
          '<div class="modal-content passphrase-dialog">' +
            '<div class="modal-header">' +
              '<h5 class="modal-title">Encryption</h5>' +
              '<button type="button" class="dialog-close" aria-label="Close">' +
                '<i class="icon-x"></i>' +
              '</button>' +
            '</div>' +
            '<div class="modal-body">' +
              '<label class="form-label">' + (noteId ? 'Enter your passphrase to unlock this note:' : 'Enter your passphrase to start a new encrypted note:') + '</label>' +
              '<div class="password-wrapper">' +
                '<input type="password" class="form-control" placeholder="Passphrase" autocomplete="off">' +
                '<button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle visibility">' +
                  '<i class="icon-eye-off"></i>' +
                '</button>' +
              '</div>' +
              '<p class="unlock-error"></p>' +
            '</div>' +
            '<div class="modal-footer">' +
              '<button type="button" class="btn btn-secondary dialog-cancel">Cancel</button>' +
              '<button type="button" class="btn btn-primary dialog-confirm">Unlock</button>' +
            '</div>' +
          '</div>';

        document.body.appendChild(overlay);

        const input = overlay.querySelector("input");
        const confirmBtn = overlay.querySelector(".dialog-confirm");
        const cancelBtn = overlay.querySelector(".dialog-cancel");
        const closeBtn = overlay.querySelector(".dialog-close");
        const errorEl = overlay.querySelector(".unlock-error");
        const toggle = overlay.querySelector(".password-toggle");

        if (toggle) {
          toggle.addEventListener("click", function() {
            const ico = toggle.querySelector("i");
            if (input.type === "password") { input.type = "text"; ico.className = "icon-eye"; }
            else { input.type = "password"; ico.className = "icon-eye-off"; }
          });
        }

        function cleanup() { overlay.remove(); }

        async function doUnlock() {
          const passphrase = input.value;
          if (!passphrase) { errorEl.textContent = "Please enter a passphrase."; return; }
          confirmBtn.disabled = true;
          errorEl.textContent = "";
          try {
            const key = await unlock(passphrase, paramsOf(document.getElementById("notes")));
            // Verify by decrypting the actual note content
            const note = noteId ? await fetchNoteContent(noteId) : null;
            if (note && note.content) {
              await decrypt(note.content, key);
            }
            await storeKey(key);
            cleanup();
            resolve(true);
          } catch (e) {
            errorEl.textContent = "Wrong passphrase. Please try again.";
            confirmBtn.disabled = false;
            input.focus();
          }
        }

        confirmBtn.addEventListener("click", doUnlock);
        input.addEventListener("keydown", function(e) {
          if (e.key === "Enter") doUnlock();
          if (e.key === "Escape") { cleanup(); resolve(false); }
        });
        cancelBtn.addEventListener("click", function() { cleanup(); resolve(false); });
        closeBtn.addEventListener("click", function() { cleanup(); resolve(false); });
        overlay.addEventListener("click", function(e) {
          if (e.target === overlay) { cleanup(); resolve(false); }
        });
        setTimeout(function() { input.focus(); }, 50);
      });
    }

    // =========================================================================
    // Multi-select / Bulk Actions
    // =========================================================================

    const selectedNoteIds = new Set();

    function setIconChecked(icon, checked) {
      if (checked) {
        icon.classList.remove("icon-square");
        icon.classList.add("icon-square-check");
      } else {
        icon.classList.remove("icon-square-check");
        icon.classList.add("icon-square");
      }
    }

    function isIconChecked(icon) {
      return icon.classList.contains("icon-square-check");
    }

    function updateSelectionUI() {
      const normalToolbar = document.getElementById("notes-normal-toolbar");
      const bulkToolbar = document.getElementById("notes-bulk-toolbar");
      if (!normalToolbar || !bulkToolbar) return;

      const hasSelection = selectedNoteIds.size > 0;
      normalToolbar.style.display = hasSelection ? "none" : "";
      bulkToolbar.style.display = hasSelection ? "" : "none";

      // Update count label
      const countEl = bulkToolbar.querySelector(".bulk-count");
      if (countEl) countEl.innerHTML = selectedNoteIds.size + '<span class="bulk-label"> selected</span>';

      // Sync icons with selection state (after HTMX swaps)
      document.querySelectorAll(".note-select-checkbox").forEach(function(icon) {
        setIconChecked(icon, selectedNoteIds.has(icon.dataset.value));
      });

      // Update select-all icon
      const selectAll = document.getElementById("select-all-notes");
      if (selectAll) {
        const icons = document.querySelectorAll(".note-select-checkbox");
        const total = icons.length;
        const checked = Array.from(icons).filter(function(i) { return isIconChecked(i); }).length;
        setIconChecked(selectAll, total > 0 && checked === total);
      }
    }

    // Event delegation for icon clicks (bind to #main-content so it survives folder swaps)
    document.getElementById("main-content").addEventListener("click", function(e) {
      if (e.target.id === "select-all-notes") {
        const willCheck = !isIconChecked(e.target);
        document.querySelectorAll(".note-select-checkbox").forEach(function(icon) {
          if (willCheck) selectedNoteIds.add(icon.dataset.value);
          else selectedNoteIds.delete(icon.dataset.value);
        });
        updateSelectionUI();
        return;
      }

      if (e.target.classList.contains("note-select-checkbox")) {
        const val = e.target.dataset.value;
        if (selectedNoteIds.has(val)) selectedNoteIds.delete(val);
        else selectedNoteIds.add(val);
        updateSelectionUI();
      }
    });

    // Re-apply selection state after HTMX table swaps
    document.addEventListener("htmx:afterSettle", function(e) {
      if (e.detail.target && (e.detail.target.id === "main-content" || e.detail.target.id === "notes" || e.detail.target.id === "notes-table")) {
        updateSelectionUI();
      }
    });

    // Clear selection on notesChanged
    document.body.addEventListener("notesChanged", function() {
      selectedNoteIds.clear();
      updateSelectionUI();
    });

    // Cancel button
    document.addEventListener("click", function(e) {
      if (e.target.closest("#bulk-cancel-btn")) {
        selectedNoteIds.clear();
        updateSelectionUI();
      }
    });

    // Bulk delete
    document.addEventListener("click", async function(e) {
      if (!e.target.closest("#bulk-delete-btn")) return;
      const ids = Array.from(selectedNoteIds);
      if (!ids.length) return;

      const confirmed = await window.showConfirm({
        title: "Delete Notes",
        message: "Are you sure you want to delete " + ids.length + " note" + (ids.length > 1 ? "s" : "") + "?",
        confirmText: "Delete",
        isDangerous: true,
      });
      if (!confirmed) return;

      await fetch("{% url 'notes:bulk-delete' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
        body: JSON.stringify({ note_ids: ids.map(Number) }),
      });
      selectedNoteIds.clear();
      htmx.trigger(document.body, "notesChanged");
    });

    // Bulk move folder
    document.addEventListener("click", async function(e) {
      const option = e.target.closest(".notes-bulk-move-option");
      if (!option) return;
      e.preventDefault();
      const ids = Array.from(selectedNoteIds);
      if (!ids.length) return;

      const raw = option.dataset.folderId;
      const folderId = raw === "null" ? null : Number(raw);
      await fetch("{% url 'notes:bulk-move-folder' %}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
        body: JSON.stringify({ note_ids: ids.map(Number), folder_id: folderId }),
      });
      selectedNoteIds.clear();
      htmx.trigger(document.body, "notesChanged");
    });

    </script>
{% endblock content %}
