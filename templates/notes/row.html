<tr id="note-{{ note.id }}"
    data-note-id="{{ note.id }}"
    data-encrypted="{{ note.is_encrypted|yesno:'true,false' }}">
    <td class="select-col">
        <i class="icon-square note-select-checkbox" data-value="{{ note.id }}"></i>
    </td>
    <td class="title">
        <span class="note-title">
            <a href="{% url 'notes:note-view' note.id %}" class="note-title-link">{{ note.title }}</a>
            {# a lock marks an encrypted note and removes the encryption; an open lock, under the pointer, encrypts one that isn't #}
            <button class="btn-icon status-mark note-encrypt-toggle{% if note.is_encrypted %} is-on{% endif %}"
                    type="button"
                    data-note-id="{{ note.id }}"
                    data-encrypted="{{ note.is_encrypted|yesno:'true,false' }}"
                    data-autosave-url="{% url 'notes:note-autosave' note.id %}"
                    title="{% if note.is_encrypted %}Remove encryption{% else %}Encrypt{% endif %}">
                <i class="{% if note.is_encrypted %}icon-lock{% else %}icon-lock-open{% endif %}"></i>
            </button>
        </span>
    </td>
    <td class="created">{{ note.created_at|date:"Y-m-d" }}</td>
    <td class="updated">
        <span class="row-text">{{ note.updated_at|date:"Y-m-d" }}</span>
        {# the row's actions, over the date while the row is under the pointer #}
        <span class="row-actions">
            <button class="btn-icon"
                    type="button"
                    hx-get="{% url 'notes:edit' note.id %}"
                    hx-target="#htmx-modal-container"
                    title="Edit details">
                <i class="icon-pencil"></i>
            </button>
        </span>
    </td>
</tr>
