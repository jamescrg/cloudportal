{% load cache_buster %}
<div class="modal-dialog modal-lg search"
     data-notes-url="{% url 'settings-encryption-notes' %}"
     {% if user.encryption_salt %}data-encryption-salt="{{ user.encryption_salt }}" data-encryption-iterations="{{ user.encryption_iterations }}" data-encryption-wrapped-key="{{ user.encryption_wrapped_key }}"{% endif %}>
    <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title">Search</h1>
            <div>
                <button type="button" @click="$dispatch('close-modal')">
                    <i class="icon-x"></i>
                </button>
            </div>
        </div>
        <div class="modal-body">
            <div class="search-form">
                <div class="input-group">
                    <label for="search-text"></label>
                    <input type="text"
                           id="search-text"
                           class="search-text"
                           name="search_text"
                           hx-post="{% url 'search-results' %}"
                           hx-trigger="keyup changed delay:500ms, search"
                           hx-target="#search-results"
                           hx-include=".search-scope-checkbox"
                           autocomplete="off"
                           placeholder="Search..."
                           autofocus />
                    <span class="input-group-text">
                        <i class="icon-search"></i>
                    </span>
                </div>
                <div class="search-scopes">
                    {% for key, label, model in scopes %}
                        <label class="search-scope">
                            <input type="checkbox"
                                   class="search-scope-checkbox"
                                   name="scope_{{ key }}"
                                   {% if key in active_scopes %}checked{% endif %}
                                   hx-post="{% url 'search-results' %}"
                                   hx-trigger="change"
                                   hx-target="#search-results"
                                   hx-include="#search-text, .search-scope-checkbox" />
                            {{ label }}
                        </label>
                    {% endfor %}
                </div>
            </div>
            <div id="search-results" class="search-results">
                <div class="search-results-placeholder">
                    <i class="icon-search"></i>
                    <p>Search across your data</p>
                </div>
            </div>
        </div>
    </div>
    {# an inline module runs each time the modal is loaded; a module with a src would run once per page #}
    <script type="module">
      import { init } from "{% static_v 'js/notes-search.js' %}";
      init(document.querySelector(".modal-dialog.search"));
    </script>
</div>
