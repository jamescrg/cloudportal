{% comment %}
The site's pages, as list items. nav.html lays them out as the desktop
bar; the mobile menu drawer (base.html) stacks the same items, each
with its icon, which the bar leaves out.
{% endcomment %}
<li {% if page == 'home' %}class="active"{% endif %}>
    <a href="{% url 'home' %}"><i class="nav-icon icon-house"></i>Home</a>
</li>
<li {% if page == 'favorites' %}class="active"{% endif %}>
    <a href="{% url 'favorites' %}"><i class="nav-icon icon-star"></i>Favorites</a>
</li>
<li {% if page == 'calendar' %}class="active"{% endif %}>
    <a href="{% url 'calendar:index' %}"><i class="nav-icon icon-calendar"></i>Calendar</a>
</li>
<li {% if page == 'tasks' %}class="active"{% endif %}>
    <a href="{% url 'tasks' %}"><i class="nav-icon icon-list-checks"></i>Tasks</a>
</li>
<li {% if page == 'contacts' %}class="active"{% endif %}>
    <a href="{% url 'contacts' %}"><i class="nav-icon icon-contact"></i>Contacts</a>
</li>
<li {% if page == 'notes' %}class="active"{% endif %}>
    <a href="{% url 'notes:index' %}"><i class="nav-icon icon-sticky-note"></i>Notes</a>
</li>
<li {% if page == 'weather' %}class="active"{% endif %}>

</li>
