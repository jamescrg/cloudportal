{% comment %}
    The variant themes' weather, behind every page: the theme's own file
    (theme-matcha-mist.css, theme-hojicha-steam.css) says what each layer
    looks like and how it moves; atmosphere.css holds what they share.
{% endcomment %}
<div class="atmos" aria-hidden="true">
    <div class="atmos-sky">
        <i class="atmos-glow"></i>
        <i class="atmos-cloud atmos-cloud-1"></i>
        <i class="atmos-cloud atmos-cloud-2"></i>
        <i class="atmos-cloud atmos-cloud-3"></i>
        <i class="atmos-cloud atmos-cloud-4"></i>
        <i class="atmos-cloud atmos-cloud-5"></i>
    </div>
    <i class="atmos-grain"></i>
</div>
