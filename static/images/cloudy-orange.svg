<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#cloud-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- The development favicon: the same mark starting from orange, so a dev tab is told from a live one at a glance. -->
  <style>
    .from { stop-color: #9a3412; }
    .to { stop-color: #8e51ff; }
    @media (prefers-color-scheme: dark) {
      .from { stop-color: #fe8019; }
      .to { stop-color: #fabd2f; }
    }
  </style>
  <defs>
    <!-- One diagonal run across the whole icon (user space, not each path's
         own box), with the stops at 15% and 85% as on the Kosmos mark -->
    <linearGradient id="cloud-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop class="from" offset="0.15" />
      <stop class="to" offset="0.85" />
    </linearGradient>
  </defs>
  <path d="M17.5 21H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
  <path d="M22 10a3 3 0 0 0-3-3h-2.207a5.502 5.502 0 0 0-10.702.5" />
</svg>
